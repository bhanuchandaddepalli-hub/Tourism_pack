
name: Tourism Package Prediction MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ---------------------------------------
  # 1. Dataset Registration
  # ---------------------------------------
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py


  # ---------------------------------------
  # 2. Data Preparation
  # ---------------------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Verify Train Test Files
        run: |
          ls -lh Xtrain.csv Xtest.csv ytrain.csv ytest.csv

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv


  # ---------------------------------------
  # 3. Model Training and Experiment Tracking
  # ---------------------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Verify Downloaded Files
        run: |
          ls -lh Xtrain.csv Xtest.csv ytrain.csv ytest.csv

      - name: Start MLflow Server
        run: |
          nohup mlflow ui \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts \
            > mlflow.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health; then
              echo "MLflow server is ready."
              exit 0
            fi
            sleep 2
          done

          cat mlflow.log
          exit 1

      - name: Model Building and Experiment Tracking
        run: python tourism_project/model_building/train.py

      - name: Verify Trained Model
        run: |
          test -f tourism_project/deployment/best_best_tourism_model_v1.joblib
          ls -lh tourism_project/deployment/best_best_tourism_model_v1.joblib

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_best_tourism_model_v1.joblib

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Add trained tourism model [skip ci]"
            git push
          fi

